      <stop offset="0%" stop-color="#E3EDFB"/>
      <stop offset="100%" stop-color="#C9DCF8"/>
    </linearGradient>
    <linearGradient id="vl-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E6FD1"/>
      <stop offset="100%" stop-color="#1B4FA0"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="120" height="120" rx="28" fill="url(#vl-bg)"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#2E6FD1" stroke-width="2" stroke-opacity="0.2"/>
