  <!-- Door / Lock -->
  <rect x="51" y="68" width="18" height="26" rx="4" fill="#E3EDFB" stroke="#2E6FD1" stroke-width="2"/>
  <circle cx="60" cy="77" r="3" fill="#1B4FA0"/>
  <path d="M60 80v6" stroke="#1B4FA0" stroke-width="2" stroke-linecap="round"/>
  <!-- Verified Fixed Contract Check Badge -->
  <circle cx="84" cy="44" r="14" fill="#2E6FD1" stroke="#FFFFFF" stroke-width="2.5"/>
