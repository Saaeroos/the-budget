<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEFD6"/>
      <stop offset="100%" stop-color="#F7E1B5"/>
    </linearGradient>
    <linearGradient id="hh-basket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9AE3C"/>
      <stop offset="100%" stop-color="#C98A0E"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#hh-bg)"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#C98A0E" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Basket Handle -->
  <path d="M40 58V40a20 20 0 0 1 40 0v18" stroke="#9A6300" stroke-width="3" stroke-linecap="round"/>
  <!-- Items in Basket -->
  <!-- Apple / fruit -->
  <circle cx="48" cy="52" r="9" fill="#E0665C" stroke="#96271F" stroke-width="1.5"/>
  <path d="M48 43c1-2 4-3 5-3" stroke="#0E7A63" stroke-width="2" stroke-linecap="round"/>
  <!-- Baguette / bread -->
  <rect x="64" y="32" width="10" height="28" rx="5" transform="rotate(18 64 32)" fill="#E9AE3C" stroke="#9A6300" stroke-width="1.5"/>
  <line x1="67" y1="38" x2="72" y2="39" stroke="#9A6300" stroke-width="1.2"/>
  <line x1="69" y1="44" x2="74" y2="45" stroke="#9A6300" stroke-width="1.2"/>
  <!-- Milk / Bottle -->
  <rect x="54" y="42" width="14" height="20" rx="2" fill="#FFFFFF" stroke="#4A5365" stroke-width="1.5"/>
  <rect x="58" y="38" width="6" height="4" rx="1" fill="#2E6FD1"/>
  <!-- Basket Body -->
  <path d="M28 58h64l-8 34c-1 4-5 7-9 7H45c-4 0-8-3-9-7l-8-34z" fill="url(#hh-basket)" stroke="#9A6300" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Woven pattern lines -->
  <line x1="33" y1="68" x2="87" y2="68" stroke="#9A6300" stroke-width="1.75" opacity="0.6"/>
  <line x1="37" y1="78" x2="83" y2="78" stroke="#9A6300" stroke-width="1.75" opacity="0.6"/>
  <line x1="48" y1="59" x2="45" y2="98" stroke="#9A6300" stroke-width="1.75" opacity="0.6"/>
  <line x1="60" y1="59" x2="60" y2="98" stroke="#9A6300" stroke-width="1.75" opacity="0.6"/>
  <line x1="72" y1="59" x2="75" y2="98" stroke="#9A6300" stroke-width="1.75" opacity="0.6"/>
</svg>
