  <circle cx="60" cy="60" r="46" stroke="#12A184" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>
  <circle cx="60" cy="60" r="40" fill="#0E7A63" fill-opacity="0.15"/>
