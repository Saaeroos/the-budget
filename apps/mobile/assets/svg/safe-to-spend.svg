      <stop offset="0%" stop-color="#12A184"/>
      <stop offset="100%" stop-color="#0E7A63"/>
    </linearGradient>
    <linearGradient id="sts-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DFF4EE"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0E1116"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#232833" stroke-width="2"/>
